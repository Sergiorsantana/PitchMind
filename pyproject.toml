[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pitchmind"
version = "0.1.0"
description = "Pergunte à partida: ETL de tracking de futebol + RAG quantitativo verificado + identidade de camisas por fusão bayesiana com VLM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "numpy>=1.26", "scipy>=1.11", "pandas>=2.0", "duckdb>=1.0", "scikit-learn>=1.3",
  "opencv-python-headless>=4.8", "matplotlib>=3.8",
]

[project.optional-dependencies]
app = ["streamlit>=1.40"]
vlm = ["anthropic>=0.70"]
video = ["ultralytics>=8.0"]
ocr = ["torch>=2.1", "torchvision>=0.16"]
dev = ["pytest>=8"]

[project.scripts]
pitchmind = "pitchmind.cli:main"

[tool.setuptools.packages.find]
include = ["pitchmind*"]
